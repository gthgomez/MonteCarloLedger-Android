android.useAndroidX=true
android.enableJetifier=false
# Room SQLite JDBC needs org.sqlite.tmpdir as a JVM system property (set in app/build.gradle.kts).
# Do not rely on a Gradle project property for this — Room reads System.getProperty only.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.enableComposeGroupMapping=false
android.experimental.composeGroupMapping=false
