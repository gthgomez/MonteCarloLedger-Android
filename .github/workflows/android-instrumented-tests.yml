# Device-side verification (V5 in docs/SHIP_STANDARD.md).
#
# The 13 `app/src/androidTest` classes (~37 tests) that cover onboarding/dashboard,
# CSV import, income/bill forecast end-to-end, payments, add-transaction and the Room
# migration matrix never ran in CI before this workflow, so a broken migration (e.g. the
# missing 16 -> 17 hop) or a broken Compose flow could merge green.
#
# This is a SEPARATE workflow on purpose: `.github/workflows/android-ci.yml` and its job
# ("Unit tests + assembleDebug", part of the required `Android CI` check) are left byte-for-byte
# untouched, so the required check name and its semantics are preserved. This job is additive.
#
# Trigger / flakiness policy:
#   - runs on every `pull_request` targeting `main` (the useful default) and on manual dispatch.
#   - hosted AVDs are the only device available to this repo (no self-hosted runner), and they
#     are slower (~10 min) and historically more flaky than unit tests. If a flake is ever
#     observed, set the repository variable `INSTRUMENTED_TESTS_ENABLED=false` to make PR runs
#     opt-out: the job then reports an explicit `::notice::` explaining that it was skipped,
#     while `workflow_dispatch` always runs it.
#   - `continue-on-error` is deliberately NOT used: a failing instrumented test fails the job.
#
# Emulator rendering policy (headless):
#   - the AVD is a `google_apis` API 34 x86_64 image booted with the headless software
#     renderer (`-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none`)
#     and with window/transition/animator scales forced to 0.
#   - the test run always COLD BOOTS (`-no-snapshot-load -no-snapshot-save`). Restoring a
#     snapshot hands the emulator a framebuffer/GL state captured by a previous emulator
#     process, which is what produces the `DisplaySurfaceGlContextHelper context was
#     preempted by others` / `Failed to restore previous context` / `Failed to bind to
#     texture: invalid color buffer` noise and can leave the display surface unusable.
#     A cold boot costs ~1 min more but always builds a fresh SwiftShader context.
#   - `emulator-boot-timeout` is raised to 15 min because software rendering boots slower
#     than a host-GPU boot; the job itself is capped at 60 min.
name: Android Instrumented Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-android-tests:
    name: connectedDebugAndroidTest (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Decide whether to run
        id: gate
        env:
          INSTRUMENTED_TESTS_ENABLED: ${{ vars.INSTRUMENTED_TESTS_ENABLED }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$INSTRUMENTED_TESTS_ENABLED" != "false" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Instrumented tests skipped: repository variable INSTRUMENTED_TESTS_ENABLED=false. This is an explicit opt-out, not a pass — run 'Android Instrumented Tests' via workflow_dispatch to verify on a device."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Require DesignSystem composite
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f DesignSystem/build.gradle.kts ]; then
            echo "::error::In-repo DesignSystem missing (includeBuild). Cannot build standalone."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        if: steps.gate.outputs.run == 'true'
        run: chmod +x gradlew

      # ubuntu-latest has hardware acceleration available, but /dev/kvm is not world-writable
      # by default; the emulator needs it or it falls back to painfully slow software rendering.
      - name: Enable KVM group perms
        if: steps.gate.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD (device definition + adb keys) so it is not re-created on every run.
      # The key is bumped whenever the emulator options change so an AVD/snapshot built by an
      # older, differently-configured emulator is never reused.
      - name: AVD cache
        id: avd-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-google_apis-x86_64-v2

      - name: Create AVD for caching
        if: steps.gate.outputs.run == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          emulator-boot-timeout: 900
          disable-animations: true
          script: echo "Created AVD for caching."

      - name: Run instrumented tests
        if: steps.gate.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            # Record the renderer actually in use so the next run can be checked against the
            # assumptions above (expect `ro.hardware.egl=swiftshader`).
            echo "ro.hardware.egl=$(adb shell getprop ro.hardware.egl | tr -d '\r')"
            echo "ro.kernel.qemu=$(adb shell getprop ro.kernel.qemu | tr -d '\r')"
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
