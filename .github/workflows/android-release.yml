# MonteCarloLedger — release build gate
#
# Purpose: keep the R8/minified release path compiling. This is a SEPARATE
# workflow from "Android CI" so the required "Android CI" check name and its
# job graph are untouched.
#
# Signing is optional and CI-only. The same `:app:assembleRelease` command is
# run on every event, but the signing environment differs by event:
#
#   * pull_request — NO signing credentials are placed in the environment
#     (a same-repo PR could otherwise exfiltrate them). The job still runs the
#     full release compile gate and produces app-release-unsigned.apk.
#   * push / workflow_dispatch — if the ANDROID_KEYSTORE_BASE64 secret is set, a
#     step decodes it to $RUNNER_TEMP/keystore.jks and exports
#     ANDROID_KEYSTORE_PATH / alias / passwords, so the build produces a signed
#     app-release.apk. If the secret is unset the build is unsigned and still
#     passes.
#
# The keystore is supplied as base64 (not as a path secret): a path secret would
# point at a file that does not exist on the ephemeral runner. Local
# keystore.properties support is unchanged (see app/build.gradle.kts).
# See docs/RELEASE.md.
name: Android Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-assemble:
    name: assembleRelease (R8/minify)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require DesignSystem composite
        run: |
          if [ ! -f DesignSystem/build.gradle.kts ]; then
            echo "::error::In-repo DesignSystem missing (includeBuild). Cannot build standalone."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the base64 keystore secret onto the ephemeral runner and export
      # the ANDROID_KEYSTORE_* variables for the build step. Restricted to
      # non-PR events: on pull_request this step is skipped entirely, so the
      # signing environment is never present for PR builds.
      #
      # Secret values are passed in via `env:` (never interpolated into the
      # script text) and are never echoed; only the alias and the (non-secret)
      # materialized path are logged.
      - name: Materialize release keystore (non-PR only)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured — release build will be UNSIGNED."
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          {
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"
          echo "Release keystore materialized at ${KEYSTORE_PATH} (alias '${ANDROID_KEY_ALIAS}')."

      # On PR events the step above is skipped, so this is an unsigned build.
      # Either way this step is the release compile gate.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Report artifact signing status
        run: |
          ls -l app/build/outputs/apk/release/ || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Release output: SIGNED (app-release.apk)"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Release output: UNSIGNED (app-release-unsigned.apk) — no signing secrets configured."
          else
            echo "::error::No release APK produced."
            exit 1
          fi

      - name: Upload unit/release build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
